<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 9º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">9º Ano - Ensino Fundamental</p>
    <p class="estudante">Estudante: <strong>Estudante Exemplo</strong></p>
  </header>

  <main class="conteudo-principal">
    <!-- Área Superior: Cards de Resumo -->
    <section class="container-cards">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="card-media">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="card-faltas">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="card-bom-desempenho">—</p>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="card-atencao">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="card-frequencia">92%</p>
        <small>Frequência adequada</small>
      </div>
    </section>

    <!-- Tabela Responsiva de Disciplinas -->
    <section class="container-tabela">
      <h2>Desempenho por Disciplina</h2>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As 15 linhas serão inseridas automaticamente via JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
